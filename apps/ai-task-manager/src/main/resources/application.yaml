logging:
  level:
    org.springframework.web.client: INFO

spring:
  application:
    name: ai-task-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: openid, https://www.googleapis.com/auth/calendar

server:
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173/}
  public-base-url: ${PUBLIC_BACKEND_URL:http://localhost:8080}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

agent:
  fast-api-url: ${FAST_API_URL:http://localhost:8000}
  daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:20}
  time-zone: ${AI_TIME_ZONE:Europe/Madrid}
