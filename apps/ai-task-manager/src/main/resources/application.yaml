spring:
  application:
    name: ai-task-manager

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1049882223608-q5c2asci2ab0uesf5p91tj9v5nocegf0.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            # redirect-uri: "{baseUrl}/login/oauth2/code/google"
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, https://www.googleapis.com/auth/calendar

agent:
  fast-api-url: ${FAST_API_URL:http://localhost:8000}
  daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:20}
  time-zone: ${AI_TIME_ZONE:Europe/Madrid}
