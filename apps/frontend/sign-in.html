<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef2ff">
    <meta name="description" content="Sign in to TaskAI.">
    <title>Sign in · TaskAI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body class="auth-body">
    <main class="auth-layout">
        <section class="auth-card" aria-labelledby="auth-title">
            <div class="auth-brand">
                <span class="brand-mark" data-icon="sparkles"></span>
                <span class="auth-brand-name">TaskAI</span>
            </div>

            <h1 id="auth-title" class="auth-title">Sign in</h1>

            <p id="auth-notice" class="auth-notice" role="status" hidden></p>

            <div class="auth-actions">
                <button id="sign-in" class="btn btn-primary btn-lg btn-block" type="button">
                    <span data-icon="user"></span>
                    Sign in
                </button>
                <button id="try-demo" class="btn btn-secondary btn-lg btn-block" type="button">
                    <span data-icon="sparkles"></span>
                    Try demo
                </button>
                <button id="continue-demo" class="btn btn-secondary btn-lg btn-block" type="button" hidden>Continue demo</button>
            </div>

            <p id="auth-error" class="auth-error" role="alert" hidden>
                <span class="auth-error-icon" data-icon="alert"></span>
                <span id="auth-error-text"></span>
            </p>

            <p class="auth-footnote">Demo data is temporary.</p>
        </section>

    </main>

    <noscript>
        <p class="auth-footnote">JavaScript is required to sign in to TaskAI.</p>
    </noscript>
    <script type="module" src="/src/authPage.ts"></script>
</body>

</html>
