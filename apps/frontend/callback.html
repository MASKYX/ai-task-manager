<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Callback</title>
</head>
<body>
    <p>Signing in...</p>

    <script type="module">
        import { completeSignIn } from "./src/main.ts";

        async function handleCallback() {
            try {
                await completeSignIn();
                window.location.replace("/index.html");
            } catch (err) {
                document.body.textContent = `Login callback failed: ${String(err)}`;
            }
        }

        handleCallback();
    </script>
</body>
</html>
